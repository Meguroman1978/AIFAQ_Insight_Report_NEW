# Fly.io configuration file
app = "aifaq-insight-report-generator"
primary_region = "nrt"  # Tokyo region

[build]

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512

[[statics]]
  guest_path = "/app/frontend"
  url_prefix = "/"
