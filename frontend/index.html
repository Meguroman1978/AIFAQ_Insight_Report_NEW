<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIFAQ Insight Report Generator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica', 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 800px;
            width: 100%;
            padding: 40px;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .upload-area {
            border: 3px dashed #667eea;
            border-radius: 10px;
            padding: 60px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 20px;
        }

        .upload-area:hover {
            border-color: #764ba2;
            background: #f9f9ff;
        }

        .upload-area.dragover {
            border-color: #764ba2;
            background: #f0f0ff;
        }

        .upload-icon {
            font-size: 48px;
            margin-bottom: 15px;
        }

        .upload-text {
            color: #666;
            font-size: 16px;
            margin-bottom: 10px;
        }

        .upload-hint {
            color: #999;
            font-size: 12px;
        }

        input[type="file"] {
            display: none;
        }

        .file-info {
            background: #f5f5f5;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            display: none;
        }

        .file-info.show {
            display: block;
        }

        .file-name {
            font-weight: bold;
            color: #333;
            margin-bottom: 5px;
        }

        .file-size {
            color: #666;
            font-size: 14px;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: transform 0.2s ease;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .progress {
            display: none;
            margin: 20px 0;
        }

        .progress.show {
            display: block;
        }

        .progress-bar {
            background: #e0e0e0;
            height: 8px;
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 10px;
        }

        .progress-fill {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100%;
            width: 0%;
            transition: width 0.3s ease;
            animation: progress-animation 1.5s infinite;
        }

        @keyframes progress-animation {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .progress-text {
            text-align: center;
            color: #666;
            font-size: 14px;
        }

        .result {
            display: none;
            margin-top: 30px;
        }

        .result.show {
            display: block;
        }

        .success-icon {
            text-align: center;
            font-size: 64px;
            margin-bottom: 20px;
        }

        .result-title {
            text-align: center;
            color: #333;
            font-size: 20px;
            margin-bottom: 20px;
        }

        .action-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .btn-secondary {
            background: white;
            color: #667eea;
            border: 2px solid #667eea;
        }

        .btn-secondary:hover {
            background: #f9f9ff;
        }

        .report-preview {
            background: #f9f9f9;
            border-radius: 8px;
            padding: 20px;
            max-height: 400px;
            overflow-y: auto;
            margin-bottom: 20px;
            font-size: 14px;
            line-height: 1.6;
        }

        .error {
            background: #fee;
            border: 1px solid #fcc;
            border-radius: 8px;
            padding: 15px;
            color: #c33;
            display: none;
            margin-bottom: 20px;
        }

        .error.show {
            display: block;
        }

        .features {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin: 30px 0;
        }

        .feature {
            text-align: center;
            padding: 20px;
            background: #f9f9ff;
            border-radius: 10px;
        }

        .feature-icon {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .feature-text {
            color: #666;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📊 AIFAQ Insight Report Generator</h1>
        <p class="subtitle">戦略的パフォーマンス分析レポート自動生成ツール</p>

        <div class="features">
            <div class="feature">
                <div class="feature-icon">📁</div>
                <div class="feature-text">Excelアップロード</div>
            </div>
            <div class="feature">
                <div class="feature-icon">🔍</div>
                <div class="feature-text">自動分析</div>
            </div>
            <div class="feature">
                <div class="feature-icon">📄</div>
                <div class="feature-text">レポート生成</div>
            </div>
        </div>

        <div class="error" id="error"></div>

        <div class="upload-area" id="uploadArea">
            <div class="upload-icon">📤</div>
            <div class="upload-text">Excelファイルをドラッグ＆ドロップ</div>
            <div class="upload-hint">または、クリックしてファイルを選択</div>
            <input type="file" id="fileInput" accept=".xlsx,.xls">
        </div>

        <div class="file-info" id="fileInfo">
            <div class="file-name" id="fileName"></div>
            <div class="file-size" id="fileSize"></div>
        </div>

        <button class="btn" id="analyzeBtn" disabled>分析を開始</button>

        <div class="progress" id="progress">
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="progress-text" id="progressText">分析中...</div>
        </div>

        <div class="result" id="result">
            <div class="success-icon">✅</div>
            <div class="result-title">分析が完了しました！</div>
            
            <div class="report-preview" id="reportPreview"></div>
            
            <div class="action-buttons">
                <button class="btn" id="downloadBtn">📥 レポートをダウンロード</button>
                <button class="btn btn-secondary" id="newAnalysisBtn">🔄 新しい分析</button>
            </div>
        </div>
    </div>

    <script>
        const API_URL = window.location.origin.includes('localhost') 
            ? 'http://localhost:8000' 
            : window.location.origin;

        let currentFileId = null;
        let selectedFile = null;

        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const fileInfo = document.getElementById('fileInfo');
        const fileName = document.getElementById('fileName');
        const fileSize = document.getElementById('fileSize');
        const analyzeBtn = document.getElementById('analyzeBtn');
        const progress = document.getElementById('progress');
        const progressFill = document.getElementById('progressFill');
        const progressText = document.getElementById('progressText');
        const result = document.getElementById('result');
        const reportPreview = document.getElementById('reportPreview');
        const downloadBtn = document.getElementById('downloadBtn');
        const newAnalysisBtn = document.getElementById('newAnalysisBtn');
        const errorDiv = document.getElementById('error');

        // クリックでファイル選択
        uploadArea.addEventListener('click', () => fileInput.click());

        // ファイル選択時
        fileInput.addEventListener('change', (e) => {
            handleFile(e.target.files[0]);
        });

        // ドラッグ&ドロップ
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            handleFile(e.dataTransfer.files[0]);
        });

        function handleFile(file) {
            if (!file) return;

            if (!file.name.endsWith('.xlsx') && !file.name.endsWith('.xls')) {
                showError('Excelファイル（.xlsx, .xls）のみ対応しています');
                return;
            }

            selectedFile = file;
            fileName.textContent = file.name;
            fileSize.textContent = formatFileSize(file.size);
            fileInfo.classList.add('show');
            analyzeBtn.disabled = false;
            hideError();
        }

        function formatFileSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
            return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
        }

        analyzeBtn.addEventListener('click', async () => {
            if (!selectedFile) return;

            try {
                // UIを分析モードに
                analyzeBtn.disabled = true;
                progress.classList.add('show');
                result.classList.remove('show');
                hideError();
                
                progressText.textContent = 'ファイルをアップロード中...';
                progressFill.style.width = '30%';

                // ファイルアップロード
                const formData = new FormData();
                formData.append('file', selectedFile);

                const uploadResponse = await fetch(`${API_URL}/api/upload`, {
                    method: 'POST',
                    body: formData
                });

                if (!uploadResponse.ok) {
                    throw new Error('ファイルのアップロードに失敗しました');
                }

                const uploadData = await uploadResponse.json();
                currentFileId = uploadData.file_id;

                progressText.textContent = 'データを分析中...';
                progressFill.style.width = '60%';

                // 分析実行
                const analyzeResponse = await fetch(`${API_URL}/api/analyze/${currentFileId}`, {
                    method: 'POST'
                });

                if (!analyzeResponse.ok) {
                    throw new Error('分析に失敗しました');
                }

                const analyzeData = await analyzeResponse.json();

                progressText.textContent = 'レポートを生成中...';
                progressFill.style.width = '90%';

                // レポート取得
                const reportResponse = await fetch(`${API_URL}/api/report/${currentFileId}`);
                
                if (!reportResponse.ok) {
                    throw new Error('レポートの取得に失敗しました');
                }

                const reportData = await reportResponse.json();

                progressFill.style.width = '100%';
                progressText.textContent = '完了！';

                // 結果表示
                setTimeout(() => {
                    progress.classList.remove('show');
                    result.classList.add('show');
                    reportPreview.textContent = reportData.content.substring(0, 1000) + '...';
                }, 500);

            } catch (error) {
                console.error('Error:', error);
                showError(error.message);
                progress.classList.remove('show');
                analyzeBtn.disabled = false;
            }
        });

        downloadBtn.addEventListener('click', () => {
            if (currentFileId) {
                window.location.href = `${API_URL}/api/download/${currentFileId}`;
            }
        });

        newAnalysisBtn.addEventListener('click', () => {
            // リセット
            selectedFile = null;
            currentFileId = null;
            fileInput.value = '';
            fileInfo.classList.remove('show');
            result.classList.remove('show');
            analyzeBtn.disabled = true;
            progressFill.style.width = '0%';
        });

        function showError(message) {
            errorDiv.textContent = '❌ ' + message;
            errorDiv.classList.add('show');
        }

        function hideError() {
            errorDiv.classList.remove('show');
        }
    </script>
</body>
</html>
